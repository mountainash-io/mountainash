[pytest]
asyncio_default_fixture_loop_scope = function


# Suppress upstream warnings we can't fix
filterwarnings =
    ignore:fetch_arrow_table\(\) is deprecated:DeprecationWarning:ibis.backends.duckdb
    ignore:Found complex group-by expression:UserWarning

# Directories that pytest should search for tests in.
testpaths = tests

# Files that pytest should discover.
python_files = test_*.py
python_classes = Test*


# Functions and methods that pytest should discover.
python_functions = test_*

# Display a verbose summary of the test results at the end of the run.
addopts = --strict-markers --tb=short -p pytester

# Marker definitions
markers =
    unit: Tier — fast, isolated; no backend or a single backend.
    cross_backend: Tier — parametrised over the backend matrix.
    integration: Tier — multi-component end-to-end.
    contract: Tier — verification harness; always run.
    slow: Flag — long-running; deselectable.
    perf: Flag — benchmark; nightly only.
    # TODO Task 4: demote/remove — legacy markers applied programmatically in conftest files
    argument_types: Legacy — cross-backend argument/option channel tests; applied by tests/expressions/argument_types/conftest.py
    temporal: Legacy — temporal operation tests; applied by tests/conftest.py pytest_collection_modifyitems
    arithmetic: Legacy — arithmetic operation tests; applied by tests/conftest.py pytest_collection_modifyitems
    string: Legacy — string operation tests; applied by tests/conftest.py pytest_collection_modifyitems
    protocol_alignment: Legacy — protocol wiring/alignment drift tests; used via pytestmark in tests/core/test_protocol_alignment.py

# Capture stdout and stderr only when a test fails.
# log_cli_level = ERROR
# log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
# log_cli_date_format = %Y-%m-%d %H:%M:%S
log_cli = false
; log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Fail the test run after the first failure.
# Uncomment the line below if you want this behavior.
# addopts = --maxfail=1

# Generate a detailed report of all (or just failed) test cases.
# Uncomment to enable.
# addopts = --detailed-report

# Display markers in the test output.
# Uncomment to enable.
# addopts = -m "not slow"

# Markers that are recognized by pytest.
# This is just an example. You can define your own markers for various purposes.
# markers =
#    slow: marks tests as slow (deselect with '-m "not slow"')
