[pytest]
asyncio_default_fixture_loop_scope = function


# Suppress upstream warnings we can't fix
filterwarnings =
    ignore:fetch_arrow_table\(\) is deprecated:DeprecationWarning:ibis.backends.duckdb
    ignore:Found complex group-by expression:UserWarning

# Directories that pytest should search for tests in.
testpaths = tests
pythonpath = .

# Files that pytest should discover.
python_files = test_*.py
python_classes = Test*


# Functions and methods that pytest should discover.
python_functions = test_*

# Display a verbose summary of the test results at the end of the run.
addopts = --strict-markers --tb=short

# Marker definitions
markers =
    unit: Tier — fast, isolated; no backend or a single backend.
    cross_backend: Tier — parametrised over the backend matrix.
    integration: Tier — multi-component end-to-end.
    contract: Tier — verification harness; always run.
    argument_types: Legacy — cross-backend argument/option channel tests; applied programmatically by tests/expressions/argument_types/conftest.py via item.add_marker().
    temporal: Descriptive — temporal operation tests; used as @pytest.mark.temporal decorator in test files.
    arithmetic: Descriptive — arithmetic operation tests; used as @pytest.mark.arithmetic decorator in test files.
    string: Descriptive — string operation tests; used as @pytest.mark.string decorator in test files.
    protocol_alignment: Descriptive — protocol wiring/alignment drift tests; used via pytestmark in tests/core/test_protocol_alignment.py.

# Capture stdout and stderr only when a test fails.
# log_cli_level = ERROR
# log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
# log_cli_date_format = %Y-%m-%d %H:%M:%S
log_cli = false
; log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Fail the test run after the first failure.
# Uncomment the line below if you want this behavior.
# addopts = --maxfail=1

# Generate a detailed report of all (or just failed) test cases.
# Uncomment to enable.
# addopts = --detailed-report

# Display markers in the test output.
# Uncomment to enable.
# addopts = -m "not slow"

# Markers that are recognized by pytest.
# This is just an example. You can define your own markers for various purposes.
# markers =
#    slow: marks tests as slow (deselect with '-m "not slow"')
