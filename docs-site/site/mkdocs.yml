# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Mountainash Core'
site_description: 'An intelligent textbook for the mountainash cross-backend data expression and relational pipeline library'
site_author: 'Nathaniel Ramm'
site_url: !ENV [TEXTBOOK_SITE_URL, 'https://docs.mountainash.io/mountainash/']

# Hooks — runs local Python before/after page processing
# social_override.py lets per-page `image:` frontmatter override the auto-
# generated social card URL for og:image and twitter:image meta tags.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/mountainash-io/mountainash'
edit_uri: !ENV [TEXTBOOK_EDIT_URI, 'edit/main/docs-site/site/docs/']

# Copyright
copyright: 'Copyright &copy; 2026 Nathaniel Ramm. Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - Chapters:
      - List of Chapters: chapters/index.md
      - Concepts:
          - "1. What mountainash does": chapters/01-what-mountainash-does/index.md
      - Using the package:
          - "2. Installation and the package surface": chapters/02-installation-and-package-surface/index.md
          - "3. Data types": chapters/03-dtypes/index.md
          - "4. Building expressions": chapters/04-building-expressions/index.md
          - "5. Namespaces, aggregates and windows": chapters/05-namespaces-aggregates-and-windows/index.md
          - "6. Ternary logic and unknown values": chapters/06-ternary-logic/index.md
          - "7. Relations": chapters/07-relations/index.md
          - "8. Collecting results": chapters/08-collecting-results/index.md
          - "9. Execution targets and backend capabilities": chapters/09-execution-targets-and-capabilities/index.md
          - "10. Table schemas and DataPackage": chapters/10-table-schemas-and-datapackage/index.md
          - "11. Conforming data to a schema": chapters/11-conforming-data/index.md
          - "12. Data contracts": chapters/12-data-contracts/index.md
          - "13. Validation": chapters/13-validation/index.md
          - "14. RelationDAG": chapters/14-relationdag/index.md
          - "15. Pipelines": chapters/15-pipelines/index.md
          - "16. Backend support and known limits": chapters/16-backend-support-and-limits/index.md
      - Internals:
          - "17. Architecture": chapters/17-architecture/index.md
          - "18. How expressions compile": chapters/18-expression-compilation/index.md
          - "19. How relations compile": chapters/19-relation-compilation/index.md
          - "20. The capability spine": chapters/20-capability-spine/index.md
          - "21. Backends": chapters/21-backends/index.md
          - "22. Extending mountainash": chapters/22-extending-mountainash/index.md
          - "23. Contributing and testing": chapters/23-contributing-and-testing/index.md
  - License: license.md
  - Contact: contact.md
  - About: about.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'indigo'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Mountainash Core'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
