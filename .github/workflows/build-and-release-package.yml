name: Build, Verify, and Publish Package

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified candidate to PyPI (main only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    outputs:
      dist-artifact-id: ${{ steps.dist.outputs.artifact-id }}
      evidence-artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public build tools
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/build-home" PIP_CONFIG_FILE=/dev/null \
            python -I -m pip install --index-url https://pypi.org/simple build twine pytest
      - name: Check release provenance regressions
        run: python -m pytest -q -c /dev/null --rootdir . --confcutdir tests/scripts tests/scripts/test_verify_release.py
      - name: Build once and check distributions
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/build-home" PIP_CONFIG_FILE=/dev/null \
            PIP_INDEX_URL=https://pypi.org/simple \
            python -I -m build --wheel --sdist --outdir "$RUNNER_TEMP/dist"
          python -I -m twine check "$RUNNER_TEMP/dist"/*
      - name: Verify wheel, sdist, and every advertised extra
        id: verify
        run: |
          python -I scripts/verify_release.py --dist-dir "$RUNNER_TEMP/dist" \
            --output-dir "$RUNNER_TEMP/release-evidence"
      - uses: actions/upload-artifact@v4
        id: dist
        # Keep the candidate available for ARM64 even when public extras cannot resolve.
        if: ${{ !cancelled() && (success() || steps.verify.outcome == 'failure') }}
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 30

  verify-arm64:
    needs: build-and-verify
    if: ${{ !cancelled() && needs.build-and-verify.outputs.dist-artifact-id != '' && needs.build-and-verify.outputs.evidence-artifact-id != '' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-and-verify.outputs.dist-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-and-verify.outputs.evidence-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/approved-evidence
      - name: Check the original candidate hashes
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum --check "$RUNNER_TEMP/approved-evidence/SHA256SUMS"
      - name: Verify the installed candidate on ARM64
        run: |
          python -I -m pip install --index-url https://pypi.org/simple packaging
          python -I scripts/verify_release.py --dist-dir "$RUNNER_TEMP/dist" \
            --output-dir "$RUNNER_TEMP/arm64-evidence" --base-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm64-evidence
          if-no-files-found: error
          retention-days: 30

  preflight-pypi-environment:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build-and-verify, verify-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const parameters = {
              owner: context.repo.owner, repo: context.repo.repo, environment_name: 'pypi'
            };
            const {data: environment} = await github.rest.repos.getEnvironment(parameters);
            const reviewers = environment.protection_rules?.some(
              rule => rule.type === 'required_reviewers' && rule.reviewers?.length > 0
            );
            const {data: policies} = await github.rest.repos.listDeploymentBranchPolicies(parameters);
            const branch = policies.branch_policies[0];
            if (!reviewers || !environment.deployment_branch_policy?.custom_branch_policies ||
                policies.total_count !== 1 || branch?.name !== 'main' || branch?.type !== 'branch') {
              core.setFailed('pypi must require reviewers and allow only the main branch.');
            }

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build-and-verify, verify-arm64, preflight-pypi-environment]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-and-verify.outputs.dist-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-and-verify.outputs.evidence-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/approved-evidence
      - name: Recheck the exact verified artifact set
        working-directory: ${{ runner.temp }}/dist
        run: |
          python - "$RUNNER_TEMP/approved-evidence/release.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          release = json.loads(Path(sys.argv[1]).read_text())
          if release['status'] != 'passed' or release['scope'] != 'candidate-full':
              raise SystemExit('Full candidate verification has not passed')
          if set(release['files']) != {path.name for path in Path('.').iterdir()}:
              raise SystemExit('Artifact file set differs from the verified candidate')
          PY
          sha256sum --check "$RUNNER_TEMP/approved-evidence/SHA256SUMS"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/dist
          skip-existing: false

  confirm-publication:
    needs: [build-and-verify, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-and-verify.outputs.dist-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Confirm public hashes and the installed hello world
        run: |
          python -I -m pip install --index-url https://pypi.org/simple packaging
          python -I scripts/verify_release.py --dist-dir "$RUNNER_TEMP/dist" \
            --output-dir "$RUNNER_TEMP/public-evidence" --public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-evidence-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-evidence
          if-no-files-found: error
          retention-days: 30
