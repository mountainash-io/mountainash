name: Radon Complexity Checks

on:
  pull_request:
    paths:
      - "src/mountainash/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complexity-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch==1.18.2

      - name: Create virtual environment
        run: hatch env create radon

      - name: Complexity checks with radon - cc
        run: hatch run radon:radon-cc

      - name: Complexity checks with radon - mi
        run: hatch run radon:radon-mi
