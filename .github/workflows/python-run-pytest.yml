name: Pytest

on:
  pull_request:
    paths:
      - "src/mountainash/**"
  workflow_dispatch:
    inputs:
      fallback_branch:
        description: "Fallback branch to use"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - main
      test_scope:
        description: "Test scope (smoke = ~2k tests, full = ~15k tests)"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    steps:
      - name: Set fallback branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "FALLBACK_BRANCH=${{ github.event.inputs.fallback_branch }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "FALLBACK_BRANCH=${{ github.base_ref }}" >> $GITHUB_ENV
          else
            echo "FALLBACK_BRANCH=develop" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Display SQLite version
        run: |
          python -c "import sqlite3; print(f'SQLite version: {sqlite3.sqlite_version}')"

      - name: Install Hatch
        run: pip install hatch

      - name: Create virtual environment
        run: hatch env create test_github

      - name: Determine test scope
        id: scope
        run: |
          # Default to smoke for PRs; honour workflow_dispatch input otherwise.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scope="${{ github.event.inputs.test_scope }}"
          else
            scope="smoke"
          fi
          echo "scope=$scope" >> $GITHUB_OUTPUT
          echo "Running test scope: $scope"

      - name: Run Coverage Tests (smoke)
        if: steps.scope.outputs.scope == 'smoke'
        run: hatch run test_github:test-cov-smoke

      - name: Run Coverage Tests (full)
        if: steps.scope.outputs.scope == 'full'
        run: hatch run test_github:test-cov-full

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
