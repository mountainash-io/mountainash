name: Pytest

on:
  pull_request:
    paths:
      - "src/mountainash/**"
      - "tests/**"
      - "pyproject.toml"
      - "hatch.toml"
      - "pytest.ini"
      - ".github/workflows/python-run-pytest.yml"
  workflow_dispatch:
    inputs:
      test_scope:
        description: "pr (affected, 3 backends) | full (everything, 9 backends)"
        default: "pr"
        type: choice
        options: ["pr", "full"]
  merge_group: {}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'merge_group'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Display SQLite version
        run: |
          python -c "import sqlite3; print(f'SQLite version: {sqlite3.sqlite_version}')"

      # Clone the mountainash-* sibling packages into temp/ so the test_github
      # hatch env (which pins them at {root:uri}/temp/<repo>) can resolve them.
      # Uses the branch matching this PR's head_ref where it exists, else the
      # base branch (default develop).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      - name: Load Dependencies
        id: deps
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Checkout Dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.deps.outputs.dependencies }}
          target-branch: ${{ github.head_ref }}
          default-branch: ${{ github.base_ref || 'develop' }}
          token: ${{ steps.app-token.outputs.token }}
          org-name: mountainash-io

      - name: Install Hatch
        run: pip install hatch

      - name: Create virtual environment
        run: hatch env create test_github

      - name: Compute affected selection
        id: sel
        run: |
          if [ "${{ github.event.inputs.test_scope }}" = "full" ]; then
            ARGS="tests"
            SCOPE="full"
          else
            # Run the driver with plain python (+ pyyaml) — NOT `hatch run`,
            # whose env banner would pollute the captured value. `tail -n1`
            # keeps only the driver's single output line as belt-and-suspenders.
            python -m pip install --quiet pyyaml
            BASE="origin/${{ github.base_ref || 'develop' }}"
            git fetch origin "${{ github.base_ref || 'develop' }}" || true
            ARGS=$(python scripts/select_tests.py --base "$BASE" | tail -n1)
            SCOPE="pr"
          fi
          echo "Selected scope=$SCOPE args=$ARGS"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"

      - name: Run selected tests
        env:
          MA_BACKEND_SCOPE: ${{ steps.sel.outputs.scope }}
        run: hatch run test_github:test-cov ${{ steps.sel.outputs.args }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1

  full-on-merge-queue:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: true

      # Clone the mountainash-* siblings into temp/ (see the `test` job above).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      - name: Load Dependencies
        id: deps
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Checkout Dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.deps.outputs.dependencies }}
          target-branch: ""
          default-branch: develop
          token: ${{ steps.app-token.outputs.token }}
          org-name: mountainash-io

      - run: pip install hatch

      - run: hatch env create test_github

      - env:
          MA_BACKEND_SCOPE: full
        run: hatch run test_github:test-cov tests -m "not perf"
