name: Pytest

on:
  pull_request:
    paths:
      - "src/mountainash/**"
      - "tests/**"
      - "pyproject.toml"
      - "hatch.toml"
      - "pytest.ini"
      - ".github/workflows/python-run-pytest.yml"
  workflow_dispatch:
    inputs:
      test_scope:
        description: "pr (affected, 3 backends) | full (everything, 9 backends)"
        default: "pr"
        type: choice
        options: ["pr", "full"]
  merge_group: {}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'merge_group'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Display SQLite version
        run: |
          python -c "import sqlite3; print(f'SQLite version: {sqlite3.sqlite_version}')"

      - name: Install Hatch
        run: pip install hatch

      - name: Create virtual environment
        run: hatch env create test_github

      - name: Compute affected selection
        id: sel
        run: |
          if [ "${{ github.event.inputs.test_scope }}" = "full" ]; then
            echo "args=tests" >> $GITHUB_OUTPUT
            echo "scope=full" >> $GITHUB_OUTPUT
          else
            BASE="origin/${{ github.base_ref || 'develop' }}"
            git fetch origin "${{ github.base_ref || 'develop' }}" --depth=1 || true
            ARGS=$(hatch run test_github:python scripts/select_tests.py --base "$BASE")
            echo "args=$ARGS" >> $GITHUB_OUTPUT
            echo "scope=pr" >> $GITHUB_OUTPUT
          fi
          echo "Selected: $(cat $GITHUB_OUTPUT)"

      - name: Run selected tests
        env:
          MA_BACKEND_SCOPE: ${{ steps.sel.outputs.scope }}
        run: hatch run test_github:test-cov ${{ steps.sel.outputs.args }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1

  full-on-merge-queue:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: true

      - run: pip install hatch

      - run: hatch env create test_github

      - env:
          MA_BACKEND_SCOPE: full
        run: hatch run test_github:test-cov tests -m "not perf"
