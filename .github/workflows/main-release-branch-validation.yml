# Pre-merge validation workflow
name: Validate Main Release PR - Source Branch

on:
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  pre-release-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Source Branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(release|hotfix)/ ]]; then
            echo "Error: Only release/* or hotfix/* branches can target main"
            exit 1
          fi
