# Pre-merge validation workflow
name: Validate Main Release PR - Build Dependencies

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  main-release-build-dependencies:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Build Tools
        run: |
          pip install hatchling==1.33.0 hatch==1.18.2

      - name: Build Package
        run: |
          python -m hatchling build

      - name: Validate Package
        run: |
          pip install twine==7.0.0
          twine check dist/*

      - name: Test Install
        run: |
          pip install dist/mountainash-*.whl
          python -c "import mountainash as ma; print('Version:', ma.__version__); print('OK')"
