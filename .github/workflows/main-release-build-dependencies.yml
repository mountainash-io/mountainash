# Pre-merge validation workflow
name: Validate Main Release PR - Build Dependencies

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  main-release-build-dependencies:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Build Tools
        run: |
          pip install hatchling==1.33.0 hatch==1.18.2

      - name: Build Package
        run: |
          python -m hatchling build

      - name: Validate Package
        run: |
          pip install twine==7.0.0
          twine check dist/*

      # Sibling packages are not on public PyPI yet; build them from source and
      # install them next to the candidate wheel. Checked out after the build so
      # temp/ cannot leak into the candidate.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io
          repositories: |
            mountainash-transport
            mountainash-files
            mountainash-data
            mountainash-settings
            mountainash-auth-client

      - name: Load Dependencies
        id: deps
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_release_dependencies.yml

      - name: Checkout Dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.deps.outputs.dependencies }}
          target-branch: ${{ github.head_ref }}
          default-branch: ${{ github.base_ref }}
          token: ${{ steps.app-token.outputs.token }}
          org-name: mountainash-io

      - name: Build checked-out sibling wheels
        env:
          DEPENDENCIES: ${{ steps.deps.outputs.dependencies }}
        run: |
          pip install build==1.6.1
          mkdir -p "$RUNNER_TEMP/dependency-wheels"
          for dependency in $(echo "$DEPENDENCIES" | jq -r '.[].name'); do
            python -m build --wheel --outdir "$RUNNER_TEMP/dependency-wheels" "temp/$dependency"
            git -C "temp/$dependency" rev-parse HEAD
          done
          test "$(find "$RUNNER_TEMP/dependency-wheels" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq "$(echo "$DEPENDENCIES" | jq 'length')"

      - name: Test Install
        run: |
          pip install dist/mountainash-*.whl "$RUNNER_TEMP"/dependency-wheels/*.whl
          python -c "import mountainash as ma; print('Version:', ma.__version__); print('OK')"
