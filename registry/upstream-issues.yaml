- id: IB-TYPE-01
  project: ibis
  category: type-inference
  summary: Arithmetic operators fail with LHS numeric literals — InputTypeError on
    nested/deferred expressions
  root_cause: upstream_bug
  affected_backends:
  - ibis-duckdb
  - ibis-polars
  - ibis-sqlite
  upstream_issue: https://github.com/ibis-project/ibis/issues/11742
  upstream_issue_filed_by: us
  status: resolved_in_mountainash
  our_workaround: fallback_impl
  notes: 'Resolved in mountainash 2026-07-17 (item 226b) via IbisBaseExpressionSystem._lift_deferred,
    which lifts the concrete left operand into the Deferred world for the one crashing
    ordering (concrete ∘ Deferred, e.g. lit + col / 5 + col). All 10 former xfails
    now pass: 7 reverse-operator tests in test_expression_builder_api.py::TestReverseArithmeticOperators,
    test_arithmetic.py::TestArithmeticEdgeCases::test_subtract_from_zero, and the
    3 test_comparison_missing_close.py::TestIsClose ibis backends (the last were mislabeled
    "nested abs()" but are the same literal-left arithmetic root cause — is_close
    builds MULTIPLY(lit, abs(other)) / ADD(lit, …)). Kept OPEN upstream for monitoring:
    remove BOTH local lifts when Ibis #11742 lands (equivalence guarded by the now-passing
    tests). Sibling item 226c — literal string receiver + Deferred argument (lit.str.contains(col))
    — also RESOLVED in PR #227 via _lift_deferred_receiver (method-call analog); when
    retiring the workaround, remove that helper and its 15 string-method routes too.'
  last_verified: '2026-07-17'
