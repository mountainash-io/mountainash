- id: MA-STR-01
  project: mountainash-internal
  category: string-ops
  summary: str.contains with a columnar (per-row) literal pattern is unsupported
    on pandas and Ibis Polars backend
  root_cause: mountainash_internal
  affected_backends:
  - pandas
  - ibis-polars
  upstream_issue: null
  upstream_issue_filed_by: null
  status: open
  our_workaround: xfail_strict
  notes: col.str.contains(other_col) raises on pandas (enriched BackendCapabilityError,
    not registry-resolvable) and ibis-polars (UnsupportedArgumentError); polars and
    ibis-duckdb/ibis-sqlite compute the per-row substring test. Spans two unrelated
    backend families for related-but-distinct reasons, so classified as an internal
    wiring gap rather than a single upstream tracker. Linked to the pre-existing
    DivergenceFact(id="MA-STR-01") via upstream_ref, which was previously null
    (backlog item 84, 2026-08-13).
  last_verified: '2026-08-13'
- id: MA-STR-03
  project: mountainash-internal
  category: string-ops
  summary: regexp_string_split on an empty or zero-width-capable regex pattern
    diverges from the ibis-duckdb oracle on the Polars backend
  root_cause: mountainash_internal
  affected_backends:
  - polars
  upstream_issue: null
  upstream_issue_filed_by: null
  status: open
  our_workaround: xfail_strict
  notes: Polars has no native regex-split primitive, so mountainash falls back
    to a Python re.finditer-based split (backlog item 85); this correctly excludes
    captured-group text from the output (matching the ibis-duckdb oracle) but
    consolidates zero-width matches differently than DuckDB's regex engine for
    an empty ('') or zero-width-capable ('a*') pattern. Ordinary (non-degenerate)
    patterns are unaffected. Linked to DivergenceFact(id="MA-STR-03") via
    upstream_ref (backlog item 85, 2026-08-13).
  last_verified: '2026-08-13'
- id: IB-STR-12
  project: ibis
  category: string-ops
  summary: regexp_string_split has no compilation rule on Ibis SQLite backend
  root_cause: upstream_feature_gap
  affected_backends:
  - ibis-sqlite
  upstream_issue: null
  upstream_issue_filed_by: null
  status: needs_filing
  our_workaround: xfail_strict
  notes: ibis-sqlite raises OperationNotDefinedError ("Compilation rule for
    'RegexSplit' operation is not defined") for any pattern, literal or dynamic;
    ibis-duckdb translates it to native SQL correctly and ibis-polars supports
    a literal pattern. Gated as a dialect-scoped UNSUPPORTED CapabilityFact
    (whole-op, WILDCARD_PARAM) for the Ibis backend (backlog item 85, 2026-08-13).
  last_verified: '2026-08-13'
- id: IB-STR-13
  project: ibis
  category: string-ops
  summary: regexp_string_split requires a literal pattern on Ibis Polars backend
    — dynamic column argument raises IbisError
  root_cause: parameter_width
  affected_backends:
  - ibis-polars
  upstream_issue: null
  upstream_issue_filed_by: null
  status: needs_investigation
  our_workaround: error_enrichment
  notes: ibis-polars compiles regexp_string_split to Polars' native re_split;
    Ibis itself detects and rejects a dynamic (column-valued) pattern with its
    own IbisError ("Only a single scalar pattern is supported for Polars
    re_split") before reaching Polars. A literal pattern works fine. Gated as
    a dialect-scoped LITERAL_ONLY CapabilityFact for the Ibis backend (backlog
    item 85, 2026-08-13).
  last_verified: '2026-08-13'
