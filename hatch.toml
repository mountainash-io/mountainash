[metadata]
allow-direct-references = true

[version]
path = "src/mountainash/__version__.py"

[build.targets.wheel]
packages = ["src/mountainash"]


#================
# Env: dev
#================

[envs.dev]
python = "3.12"
installer = "uv"
path = ".venv"
dependencies = []

#================
# Env: build_github
#================
[envs.build_github]
installer = "uv"
dependencies = [
    "cyclonedx-bom==4.5.0",
]
[envs.build_github.scripts]
sbom-all = "cyclonedx-py environment > ./sbom-full.xml"
sbom-direct = "cyclonedx-py requirements > ./sbom-direct.xml"
export-requirements = "hatch dep show requirements > ./requirements.txt"

#================
# Env: default
#================
[envs.default]
installer = "uv"
dependencies = []

#================
# Env: tower
#================
[envs.tower]
installer = "uv"

dependencies = []


#================
# Env: test_github
#================
[[envs.test_github.matrix]]
python = ["3.12"]

[envs.test_github]
installer = "uv"
dependencies = [
    "pytest==8.3.5",
    "pytest-check==2.5.3",
    "pytest-cov==6.1.1",
    # Optional backends required by cross-backend tests
    "pandas>=2.2.0",
    "ibis-framework[duckdb,sqlite]>=9.0.0",
    "pyarrow>=16",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    # CI sibling chain: the checkout-dependencies action clones these into
    # temp/ (see .github/config/mountainash_dependencies.yml). files + transport
    # are the direct consumers; settings/auth-client/secrets are transport's
    # runtime import chain. Mirrors [envs.test] but with temp/ (CI) vs ../ (local).
    "mountainash_files @       {root:uri}/temp/mountainash-files",
    "mountainash_transport @   {root:uri}/temp/mountainash-transport",
    "mountainash_settings @    {root:uri}/temp/mountainash-settings",
    "mountainash_auth_client @ {root:uri}/temp/mountainash-auth-client",
    "mountainash_secrets @     {root:uri}/temp/mountainash-secrets",
]
[envs.test_github.scripts]
test = "pytest"
test-cov = "pytest --cov --junitxml=junit.xml -o junit_family=legacy --cov-report=xml"
# Default CI script — runs only the compile smoke suite (~2k tests). The
# full suite (~15k tests) blew out CI runtime once the cross-backend
# matrix expanded to 8 backends; use test-cov-full for the comprehensive
# run (gated via workflow_dispatch input in python-run-pytest.yml).
test-cov-smoke = "pytest tests/core/test_compile_smoke.py --cov --junitxml=junit.xml -o junit_family=legacy --cov-report=xml"
test-cov-full = "pytest --cov --junitxml=junit.xml -o junit_family=legacy --cov-report=xml"


#================
# Env: test
#================
[[envs.test.matrix]]
python = ["3.12"] #,  "3.11",, "3.10" ] # "3.8", "3.9","3.9",

[envs.test]
type = "virtual"
installer = "uv"
dependencies = [
    "coverage[toml]>=6.5",
    "pytest==8.3.5",
    "pytest-asyncio>=0.23.0",
    "pytest-check==2.5.3",
    "pytest-mock==3.12.0",
    "pytest-json-report>=1.5.0",
    "pytest-metadata>=2.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    "pytest-clarity>=1.0.1",
    "pytest-timeout>=2.1.0",
    "pytest-picked>=0.5.0",
    # All optional backends for testing
    "pandas>=2.2.0",
    "ibis-framework[duckdb,sqlite]>=9.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "xarray==2024.11.0",
    "pyyaml>=6.0",
    # Local sibling-package chain from ../ (mirrors [tool.uv.sources]; hatch's
    # env sync needs the explicit URL pins to resolve them). settings/
    # auth-client/secrets are transport's runtime import chain, not in the
    # abstract graph while transport's sibling deps are commented, so they are
    # pinned here to be installed for import at runtime.
    "mountainash_files @       {root:uri}/../mountainash-files",
    "mountainash_transport @   {root:uri}/../mountainash-transport",
    "mountainash_settings @    {root:uri}/../mountainash-settings",
    "mountainash_auth_client @ {root:uri}/../mountainash-auth-client",
    "mountainash_secrets @     {root:uri}/../mountainash-secrets",
]
[envs.test.scripts]
# ===========================================
# CORE TESTING COMMANDS - Use these daily
# ===========================================

test = [
    "pytest --cov --junitxml=junit.xml",
    "coverage json --pretty-print",
    "coverage xml",
    "coverage html",
    "coverage report --show-missing",
]

# Quick testing for iteration (no coverage overhead)
test-quick = "pytest"

# ===========================================
# TARGETED TESTING - For debugging specific issues
# ===========================================

# Target specific files/tests with coverage
test-target = [
    "coverage run --source=src  -m pytest {args}",
    "coverage xml",
    "coverage json --pretty-print",
    "coverage report --show-missing",
]

# Target specific files/tests without coverage (fastest iteration)
test-target-quick = "pytest {args}"

# Only changed files (with coverage)
test-changed = [
    "coverage run -m pytest --picked",
    "coverage json --pretty-print",
    "coverage report --show-missing",
]

# Run only tests affected by local changes vs develop (full backend scope).
affected = "pytest $(python scripts/select_tests.py --base develop)"

# Taxonomy + selector audits (the contract-tier guards, run directly).
audit-taxonomy = "python scripts/audit_test_taxonomy.py --strict"

# Only changed files (without coverage)
test-changed-quick = "pytest --picked"

# ===========================================
# SPECIALIZED TESTING
# ===========================================

# Performance benchmarks only
test-perf = "pytest --benchmark-only"
test-perf-target = "pytest --benchmark-only {args}"

# Specific test markers
test-integration = "pytest -m integration"
test-performance = "pytest -m performance"

# ===========================================
# CI/REPORTING - For automated environments
# ===========================================

# Full CI suite with all reports
test-ci = [
    "coverage run -m pytest --json-report --json-report-file=pytest_report.json --junitxml=junit.xml",
    "coverage json --pretty-print",
    "coverage xml",
    "coverage html",
    "coverage report --show-missing",
]


#================
# Env: ruff
#================
[envs.ruff]
installer = "uv"
dependencies = ["ruff==0.3.7"]
[envs.ruff.scripts]
check = "ruff check ./src"
fix = "ruff check ./src --fix"

#================
# Env: radon
#================
# Radon Complexity Checks
[envs.radon]
installer = "uv"
dependencies = ["radon==6.0.1"]
[envs.radon.scripts]
radon-cc = "radon cc ./src -nd"
radon-mi = "radon mi ./src -nd"
radon-cc-strict = "radon cc ./src -nc"
radon-mi-strict = "radon mi ./src -nc"
radon-mi-detail = "radon mi ./src"
radon-cc-detail = "radon cc ./src"

#================
# Env: griffe
#================
[envs.griffe]
installer = "uv"
dependencies = ["griffe>=1.0.0"]
[envs.griffe.scripts]
check = "griffe check --search src mountainash {args}"

#================
# Env: mypy
#================
# Mypy Type checks
[envs.mypy]
python = "3.12"
installer = "uv"
dependencies = [
    "mypy==1.10.1",
    # Explicit stub package — mypy's own `--install-types` shells out to
    # `<venv-python> -m pip install <pkg>`, but uv-provisioned venvs don't
    # ship pip, so that call silently fails and every pandas import falls
    # back to import-untyped. Declared here instead so uv installs it at
    # env-sync time like every other dependency. See backlog item 76.
    "pandas-stubs",
    # Runtime import-resolution set — mirrors [envs.test] so mypy can
    # resolve every third-party import actually used in src/ and tests/
    # (mypy needs the real package installed, not just a stub, for
    # inline-typed / py.typed libraries). Kept independent of [envs.test]
    # rather than templated from it: mypy doesn't need the pytest-plugin
    # or coverage tooling test actually runs with.
    "pandas>=2.2.0",
    "ibis-framework[duckdb,sqlite]>=9.0.0",
    "pyarrow>=16",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pytest==8.3.5",
    "mountainash_files @       {root:uri}/../mountainash-files",
    "mountainash_transport @   {root:uri}/../mountainash-transport",
    "mountainash_settings @    {root:uri}/../mountainash-settings",
    "mountainash_auth_client @ {root:uri}/../mountainash-auth-client",
    "mountainash_secrets @     {root:uri}/../mountainash-secrets",
]
[envs.mypy.scripts]
check = "mypy {args:src/mountainash tests}"
