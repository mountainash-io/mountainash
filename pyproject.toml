[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mountainash"
dynamic = ["version"]
description = "Unified cross-backend DataFrame expressions, relations, and schema management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
keywords = ["dataframe", "expressions", "polars", "pandas", "ibis", "cross-backend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.35.1",
    "narwhals>=2.20.0",
    "pydantic>=2.2,<3",
    "typing_extensions>=4.0.0",
    "lazy_loader>=0.3",
    "universal-pathlib>=0.2.0",
    "pyarrow>=16",
    "python-dateutil>=2.9,<2.10",
    "jsonschema==4.25.1",
    "referencing>=0.36,<1",
    "elementpath==5.1.1",
    "email-validator>=2.2,<3",
    "rfc3986>=2,<3",
    # mountainash-files is provided the same way as every other mountainash-*
    # sibling in this monorepo: via the CI dependency-checkout mechanism
    # (.github/config/mountainash_dependencies.yml -> temp/) and the hatch env
    # sibling pins (../ locally, temp/ in CI), NOT as a resolvable core dep —
    # the siblings are not on a reachable package index. Declare it via the
    # opt-in `files` extra below (mirrors `storage = mountainash-transport`).
    # Promote to a core dep once the packages publish to the shared index.
    # "mountainash-files>=26.7.0,<27",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2.0"]
ibis = ["ibis-framework>=9.0.0"]
storage = ["mountainash-transport"]
files = ["mountainash-files>=26.7.0,<27"]
dbos = ["dbos>=1.0.0"]
s3 = ["mountainash-files[s3]>=26.7.0"]
gcs = ["mountainash-files[gcs]>=26.7.0"]
azure = ["mountainash-files[azure]>=26.7.0"]
sftp = ["mountainash-files[sftp]>=26.7.0"]
all = ["mountainash[pandas,ibis,storage,files,dbos,s3,gcs,azure,sftp]"]

[project.urls]
Homepage = "https://github.com/mountainash-io/mountainash"
Documentation = "https://github.com/mountainash-io/mountainash#readme"
Issues = "https://github.com/mountainash-io/mountainash/issues"
Source = "https://github.com/mountainash-io/mountainash"

#================
# Tool: Coverage
#================
[tool.coverage.run]
source_pkgs = ["mountainash", "tests"]
branch = true
parallel = true
omit = ["src/mountainash/__version__.py", "src/mountainash/__version__.py"]

[tool.coverage.paths]
mountainash_data = [
    "src/mountainash",
    "*/mountainash/src/mountainash",
]
tests = ["tests", "*/mountainash/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__:", "if TYPE_CHECKING:"]


# ============================================================================
# Ruff Configuration
# ============================================================================

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "TCH",    # flake8-type-checking
]
ignore = [
    "E501",   # line too long — enforced by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export symbols intentionally
"__init__.py" = ["F401"]
# Expression backend files legitimately import their backend eagerly
"src/mountainash/expressions/backends/**" = ["TCH001", "TCH002"]
# Relation backend files legitimately import their backend eagerly
"src/mountainash/relations/backends/**" = ["TCH001", "TCH002"]
# Pydantic node files need enum/type imports at runtime for field definitions
"src/mountainash/expressions/core/expression_nodes/**" = ["TCH001", "TCH002", "TCH003"]
"src/mountainash/relations/core/relation_nodes/**" = ["TCH001", "TCH002", "TCH003"]
# Relation protocol files use types in Protocol definitions (Pydantic-based)
"src/mountainash/relations/core/relation_protocols/**" = ["TCH001", "TCH002"]
